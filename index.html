
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatty AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #101014;
      color: #f5f5f7;
      font-family: system-ui, sans-serif;
      height: 100dvh;
      display: flex;
    }
    main {
      width: 100%;
      max-width: 850px;
      margin: auto;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }
    header {
      padding: 12px 4px;
      border-bottom: 1px solid #292932;
      font-size: 23px;
      font-weight: 800;
      color: #c4b5fd;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .message {
      padding: 13px 15px;
      border-radius: 16px;
      max-width: 90%;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }
    .ai {
      align-self: flex-start;
      background: #22222b;
    }
    .user {
      align-self: flex-end;
      background: #6651c9;
    }
    form {
      display: flex;
      gap: 9px;
      padding: 12px 0;
    }
    input {
      flex: 1;
      min-width: 0;
      background: #22222b;
      color: white;
      border: 1px solid #393943;
      padding: 14px;
      border-radius: 14px;
      font-size: 16px;
      outline: none;
    }
    button {
      border: 0;
      background: #a78bfa;
      color: #171222;
      font-weight: bold;
      padding: 0 18px;
      border-radius: 14px;
      font-size: 16px;
    }
    button:disabled { opacity: .5; }
    footer {
      text-align: center;
      color: #888894;
      font-size: 12px;
      padding: 4px 0 8px;
    }
  </style>
</head>
<body>
  <main>
    <header>✦ Chatty AI</header>
    <div id="messages" aria-live="polite">
      <div class="message ai">Yo! 👋 Welcome to Chatty.

I'm your AI assistant. Send a message to get started!</div>
    </div>
    <form id="chat">
      <input id="prompt" placeholder="Message Chatty..." autocomplete="off" required>
      <button id="send" type="submit">Send</button>
    </form>
    <footer>Chatty AI · Your own little corner of the internet</footer>
  </main>
  <script>
    const form = document.querySelector("#chat");
    const input = document.querySelector("#prompt");
    const messages = document.querySelector("#messages");
    const send = document.querySelector("#send");

    function addMessage(text, role) {
      const div = document.createElement("div");
      div.className = "message " + role;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "user");
      input.value = "";
      addMessage(
        "The Chatty interface is working! The AI connection is our next step.",
        "ai"
      );
    });
  </script>
</body>
</html>
